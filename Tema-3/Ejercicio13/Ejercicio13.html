<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio DOM 3</title>
</head>
<body>
  <h2>Ejemplo de lista</h2>
  <ul id="lista">
    <li>Elemento 1</li>
    <li>Elemento 2</li>
    <li>Elemento 3</li>
    <li>Elemento 4</li>
  </ul>
  <button onclick="eliminarElementos()">Eliminar todos los elementos</button>
  <script>
    function eliminarElementos() {
      const lista = document.getElementById("lista");
      while (lista.firstChild) {
        lista.removeChild(lista.firstChild);
      }
    }
  </script>
</body>
</html>
