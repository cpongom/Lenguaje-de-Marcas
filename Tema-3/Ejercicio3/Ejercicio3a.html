<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio JS 3a - Imágenes de coches</title>
  <style>
    #imagenCoche {
      width: 400px;
      height: auto;
      display: block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h2>Imágenes de coches</h2>
  <img id="imagenCoche" src="coche1.jpg" alt="Coche 1">
  <button onclick="cambiaCoche('coche1.jpg')">Coche 1</button>
  <button onclick="cambiaCoche('coche2.jpg')">Coche 2</button>
  <button onclick="cambiaCoche('coche3.jpg')">Coche 3</button>
  <button onclick="cambiaCoche('coche4.jpg')">Coche 4</button>
  <button onclick="cambiaCoche('coche5.jpg')">Coche 5</button>
  <button onclick="cambiaCoche('coche6.jpg')">Coche 6</button>
  <script>
    function cambiaCoche(nombreImagen) {
      document.getElementById('imagenCoche').src = nombreImagen;
    }
  </script>
</body>
</html>
