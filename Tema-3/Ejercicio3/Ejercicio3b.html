<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio JS 3b - Imágenes de coches con SELECT</title>
  <style>
    #imagenCoche {
      width: 400px;
      height: auto;
      display: block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h2>Imágenes de coches</h2>
  <img id="imagenCoche" src="coche1.jpg" alt="Coche 1">
  <label for="selectorCoche">Elige un coche:</label>
  <select id="selectorCoche" onchange="cambiaCoche(this.value)">
    <option value="coche1.jpg">Coche 1</option>
    <option value="coche2.jpg">Coche 2</option>
    <option value="coche3.jpg">Coche 3</option>
    <option value="coche4.jpg">Coche 4</option>
    <option value="coche5.jpg">Coche 5</option>
    <option value="coche6.jpg">Coche 6</option>
  </select>
  <script>
    function cambiaCoche(nombreImagen) {
      document.getElementById('imagenCoche').src = nombreImagen;
    }
  </script>
</body>
</html>
